# Workflow TEMPORAL solo en el fork (no va a upstream): valida el parche #5578
name: Validate patch (fork only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-typecheck:
    name: build + tsc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/Krypton
      - run: npm ci && npm i -D @rollup/rollup-linux-x64-gnu
      - name: Production build (gate real del repo)
        run: npm run build
      - name: Typecheck (informativo: upstream main ya falla en baseline)
        run: npx tsc --noEmit 2>&1 | tee /tmp/tsc.log; echo "errores totales: $(grep -c 'error TS' /tmp/tsc.log)"; echo "errores en monthly_view: $(grep -c 'monthly_view' /tmp/tsc.log)"; exit 0
