# Workflow TEMPORAL solo en la rama del fork (no va a upstream): valida el parche #5578
name: Validate patch (fork only)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck-build:
    name: tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: lts/Krypton
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx vite build
